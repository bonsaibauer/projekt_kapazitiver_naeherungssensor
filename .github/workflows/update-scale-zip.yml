name: Update scale.zip

on:
  push:
    paths:
      - 'scale/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-zip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create scale.zip
        run: |
          rm -f scale.zip
          zip -r scale.zip scale

      - name: Commit and push updated zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scale.zip
          if git diff --cached --quiet; then
            echo "No zip changes to commit"
            exit 0
          fi
          git commit -m "chore: update scale.zip [skip ci]"
          git push
