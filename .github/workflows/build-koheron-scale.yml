name: Build Koheron Scale Instrument

on:
  push:
    paths:
      - "scale/**"
      - ".github/workflows/build-koheron-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koheron-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-check:
    name: Smoke Check (GitHub Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${GITHUB_WORKSPACE}/project/scale/config.yml"
          test -f "${GITHUB_WORKSPACE}/project/scale/block_design.tcl"
          test -f "${GITHUB_WORKSPACE}/project/scale/scale.hpp"
          test -f "${GITHUB_WORKSPACE}/project/scale/web/index.html"
          echo "Project structure looks valid."

      - name: Explain build runner requirements
        shell: bash
        run: |
          echo "Koheron full instrument build needs a self-hosted runner with Koheron/Vivado toolchain."
          echo "If the next job stays queued, your self-hosted runner is offline or labels do not match."

  build-instrument:
    name: Build Instrument (Self-Hosted Koheron Runner)
    needs: smoke-check
    runs-on: [self-hosted, linux, x64, koheron]
    timeout-minutes: 120

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout koheron-sdk
        uses: actions/checkout@v4
        with:
          repository: Koheron/koheron-sdk
          path: koheron-sdk

      - name: Environment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          whoami
          command -v make
          command -v python3
          command -v zip
          command -v unzip

      - name: Build instrument zip with Koheron Makefile
        shell: bash
        run: |
          set -euo pipefail
          cd koheron-sdk
          make CONFIG="${GITHUB_WORKSPACE}/project/scale/config.yml"

      - name: Locate generated scale.zip
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find "${GITHUB_WORKSPACE}/koheron-sdk/tmp" -type f -name "scale.zip" | head -n 1)"
          if [ -z "${ZIP_PATH}" ]; then
            echo "scale.zip not found in koheron-sdk/tmp"
            exit 1
          fi
          unzip -l "${ZIP_PATH}" | grep -E "(index.html|serverd|scale.bit|version)" >/dev/null
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload scale.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: scale-zip
          path: ${{ steps.find_zip.outputs.zip_path }}
          if-no-files-found: error
