name: Build Koheron Scale Instrument

on:
  push:
    paths:
      - "scale/**"
      - ".github/workflows/build-koheron-scale.yml"
  workflow_dispatch:

jobs:
  build-instrument:
    runs-on: self-hosted

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout koheron-sdk
        uses: actions/checkout@v4
        with:
          repository: Koheron/koheron-sdk
          path: koheron-sdk

      - name: Build instrument zip with Koheron Makefile
        shell: bash
        run: |
          set -euo pipefail
          cd koheron-sdk
          make CONFIG="${GITHUB_WORKSPACE}/project/scale/config.yml"

      - name: Locate generated scale.zip
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find "${GITHUB_WORKSPACE}/koheron-sdk/tmp" -type f -name "scale.zip" | head -n 1)"
          if [ -z "${ZIP_PATH}" ]; then
            echo "scale.zip not found in koheron-sdk/tmp"
            exit 1
          fi
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload scale.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: scale-zip
          path: ${{ steps.find_zip.outputs.zip_path }}
          if-no-files-found: error
