name: Build Deployable Scale Instrument

on:
  push:
    paths:
      - "scale/**"
      - ".github/workflows/build-koheron-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-instrument-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-instrument:
    runs-on: [self-hosted, linux, x64, koheron]
    timeout-minutes: 180

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout koheron-sdk repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KOHERON_SDK_REPOSITORY || 'Koheron/koheron-sdk' }}
          token: ${{ secrets.KOHERON_SDK_PAT || github.token }}
          path: koheron-sdk

      - name: Validate required source files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${GITHUB_WORKSPACE}/project/scale/config.yml"
          test -f "${GITHUB_WORKSPACE}/project/scale/block_design.tcl"
          test -f "${GITHUB_WORKSPACE}/project/scale/scale.hpp"
          test -f "${GITHUB_WORKSPACE}/project/scale/web/index.html"
          test -f "${GITHUB_WORKSPACE}/project/scale/web/app.ts"
          test -f "${GITHUB_WORKSPACE}/project/scale/web/scale.ts"

      - name: Build deployable scale.zip with Koheron make
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/koheron-sdk"
          make CONFIG="${GITHUB_WORKSPACE}/project/scale/config.yml"

      - name: Locate generated scale.zip
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find "${GITHUB_WORKSPACE}/koheron-sdk/tmp" -type f -name "scale.zip" | head -n 1)"
          if [ -z "${ZIP_PATH}" ]; then
            echo "No deployable scale.zip found after build."
            exit 1
          fi
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Validate deployable zip contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "${{ steps.locate.outputs.zip_path }}" | grep -E "scale.bit|serverd|index.html|version" >/dev/null
          unzip -l "${{ steps.locate.outputs.zip_path }}"

      - name: Upload deployable scale.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: scale-instrument-zip
          path: ${{ steps.locate.outputs.zip_path }}
          if-no-files-found: error
